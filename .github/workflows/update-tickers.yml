name: Weekly Ticker List Update

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-tickers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages

      - name: Run ticker update check
        id: update_check
        continue-on-error: true
        run: |
          set +e
          python update_tickers.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit logs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ticker_updates.log
          git add ticker_update_report.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Ticker update check $(date +'%Y-%m-%d')"
          git push

      - name: Update maintenance issue if action needed
        if: steps.update_check.outputs.exit_code == '1'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('ticker_update_report.txt', 'utf8');
            const title = '⚠️ Ticker List Update Required';
            const body = `Automated ticker update check found changes that need attention:\n\n\`\`\`\n${reportContent}\n\`\`\`\n\n**Action Required:**\nPlease review the report and update \`tickers_config.py\` accordingly.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ticker-update',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ticker-update', 'maintenance']
              });
            }
