name: Daily Fallen Angel Scan

on:
  schedule:
    # Run at 18:30 UTC (19:30 Polish time) on weekdays
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: fallen-angel-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The US universe is broad; the enhanced runner adds only a few history
    # requests for final candidates. Keep a generous wall-clock limit while
    # remaining on the standard GitHub-hosted runner.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest --break-system-packages

      - name: Syntax check
        run: python -m py_compile scanner_entry.py scanner_enhanced.py scanner_bugfixes.py scanner_policy.py scanner_safety.py fallen_angel_scanner.py scanner_currency.py paper_tracking.py fundamental_analysis.py research_reporting.py screening.py filing_review.py

      - name: Offline regression tests
        run: python -m pytest tests test_email_generation.py test_fresh_crash_bucket.py -q --import-mode=importlib -p no:cacheprovider

      - name: Run fallen angel scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          PYTHONUNBUFFERED: 1
        run: python -u scanner_entry.py

      - name: Refresh paper observations
        run: python paper_tracking.py

      - name: Preserve paper observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-observations-${{ github.run_id }}
          path: |
            paper_tracking.json
            paper_tracking_report.md
            research_report.json
            research_report.md
            filing_review.md

      - name: Commit scanner state
        run: |
          git config user.name "fallen-angel-bot"
          git config user.email "bot@fallen-angel"

          # Stage files only when they exist. In particular, logs/ may be
          # absent on a clean run, which must not make the workflow fail.
          git add scanner_memory.json 2>/dev/null || true
          git add failed_tickers.json 2>/dev/null || true
          git add paper_tracking.json paper_tracking_report.md 2>/dev/null || true
          git add research_report.json research_report.md filing_review.md 2>/dev/null || true
          if [ -d logs ]; then
            git add logs/*.txt 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "No scanner state changes"
          else
            git commit -m "Update scanner state $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
