name: EDGAR historical filing pilot

on:
  push:
    paths:
      - edgar_vintages.py
      - .github/workflows/edgar-vintage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sec-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests
      - name: Read 2023 filings for two known SEC issuer IDs
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_CONTACT_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: >-
          python -u edgar_vintages.py --cik 320193 --cik 886158
          --start 2023-01-01 --end 2023-12-31 --as-of 2024-01-05T00:00:00Z
          --output edgar-vintage-audit.json
      # Manulife files Canadian IFRS statements. This audit reads US GAAP only.
      - name: Audit US GAAP filing coverage for the June 2022 development cohort
        if: always()
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_CONTACT_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: >-
          python -u edgar_vintages.py
          --cik 1488139 --cik 70858 --cik 1840572 --cik 877890 --cik 49600
          --cik 1297989 --cik 799167 --cik 66570 --cik 1475841
          --cik 1415404 --cik 1320414 --cik 311094 --cik 1770450
          --start 2019-01-01 --end 2022-06-30 --as-of 2022-06-30T20:00:00Z
          --output edgar-cohort-2022.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edgar-vintage-audit
          path: |
            edgar-vintage-audit.json
            edgar-cohort-2022.json
