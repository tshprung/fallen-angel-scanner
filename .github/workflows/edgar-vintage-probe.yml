name: EDGAR historical filing pilot

on:
  push:
    paths:
      - edgar_vintages.py
      - .github/workflows/edgar-vintage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sec-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests
      - name: Read 2023 filings for two known SEC issuer IDs
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: >-
          python -u edgar_vintages.py --cik 320193 --cik 886158
          --start 2023-01-01 --end 2023-12-31 --as-of 2024-01-05T00:00:00Z
          --output edgar-vintage-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edgar-vintage-audit
          path: edgar-vintage-audit.json
