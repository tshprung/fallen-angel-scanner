name: Daily US recovery watch

on:
  schedule:
    - cron: '17 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: Verify delivery settings or run the after-close pilot
        type: choice
        options: [verify, run]
        default: verify

concurrency:
  group: daily-us-recovery
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Check session and mode
        id: session
        run: |
          ready=$(python recovery_delivery.py ready | tail -1)
          [[ "$ready" == true || "$ready" == false ]]
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "An unprocessed completed US session is available: $ready"
      - name: Verify authenticated email connection
        if: inputs.mode == 'verify'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python recovery_delivery.py verify
      - name: Send one daily recovery digest
        if: inputs.mode != 'verify' && steps.session.outputs.ready == 'true'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SENDER_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WATCH_STATE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name fallen-angel-bot
          git config user.email bot@fallen-angel
          save() {
            if ! git diff --cached --quiet; then
              git commit -m "$1"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }
          deliver() {
            local path="recovery_pending/digest.eml"
            if [[ -f "$path" ]]; then
              python recovery_delivery.py send --kind digest
              python recovery_delivery.py complete-queued
              git add recovery_watch_state.json
              git rm -- "$path"
              save "Record accepted daily digest"
            fi
          }
          deliver
          if [[ "$(python recovery_delivery.py ready | tail -1)" == false ]]; then exit 0; fi
          for stage in early followup; do
            python -u recovery_watch.py "$stage" --state recovery_watch_state.json --out data/recovery
          done
          python recovery_delivery.py queue --kind digest
          if [[ -f recovery_pending/digest.eml ]]; then
            git add recovery_pending/digest.eml
          else
            python recovery_delivery.py complete
          fi
          git add recovery_watch_state.json
          save "Save daily research and delivery state"
          deliver
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode != 'verify' && steps.session.outputs.ready == 'true'
        with:
          name: us-recovery-reports
          path: data/recovery/
          if-no-files-found: ignore
